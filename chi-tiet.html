<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Mecha Hangar</title>
    <link rel="icon" type="image/svg" href="images/logo-icon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <h1 class="logo">
            <a href="index.html">
                <img src="images/logo.svg" alt="Mecha Hangar">
            </a>
        </h1>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="san-pham.html">Sản phẩm</a>
            <a href="gio-hang.html">Giỏ hàng (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <a href="san-pham.html" class="back-link">← Quay lại danh sách</a>

        <div class="product-detail">
            <div class="detail-gallery">
                <img src="https://placehold.co/600x600?text=Model+kit" alt="Model kit" class="main-image"
                    id="main-image">
                <div class="thumbnails" id="thumbnails"></div>
            </div>

            <div class="detail-info">
                <p class="brand" id="product-brand">Tên hãng</p>
                <h2 id="product-name">Tên sản phẩm</h2>
                <p class="price detail-price" id="product-price">0đ</p>
                <p id="product-description">Mô tả sản phẩm</p>

                <table class="specs">
                    <tr>
                        <th>Tỉ lệ</th>
                        <td id="spec-scale"></td>
                    </tr>
                    <tr>
                        <th>Hãng sản xuất</th>
                        <td id="spec-brand"></td>
                    </tr>
                    <tr>
                        <th>Tình trạng</th>
                        <td id="spec-status"></td>
                    </tr>
                </table>

                <div class="buy-box">
                    <label for="quantity">Số lượng:</label>
                    <input type="number" id="quantity" class="quantity-input" value="1" min="1" max="10">
                    <button class="btn btn-primary" id="add-to-cart">Thêm vào giỏ hàng</button>
                    <button class="btn btn-secondary" id="buy-now">Mua ngay</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Mecha Hangar. Dự án học tập, phi thương mại</p>
    </footer>

    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="chi-tiet.js"></script>
</body>

</html>
