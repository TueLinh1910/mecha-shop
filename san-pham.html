<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - Mecha Hangar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <h1 class="logo">Mecha Hangar</h1>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="san-pham.html">Sản phẩm</a>
            <a href="gio-hang.html">Giỏ hàng</a>
        </nav>
    </header>

    <main>
        <h2>Tất cả sản phẩm</h2>

        <div class="toolbar">
            <input type="text" id="search-input" class="search-input" placeholder="Tìm kiếm sản phẩm ...">

            <div class="filter-group">
                <label for="brand-filter">Hãng:</label>
                <select id="brand-filter">
                    <option value="all">Tất cả</option>
                    <option value="motor-nuclear">Motor Nuclear</option>
                    <option value="in-era">In Era+</option>
                    <option value="sunday-hobby">Sunday Hobby</option>
                    <option value="einta">EINTA INDUSTRIES</option>
                    <option value="snaa">SNAA</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sort-select">Sắp xếp:</label>
                <select id="sort-select">
                    <option value="default">Mặc định</option>
                    <option value="price-asc">Giá thấp đến cao</option>
                    <option value="price-desc">Giá cao đến thấp</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="scale-filter">Tỉ lệ:</label>
                <select id="scale-filter">
                    <option value="all">Tất cả</option>
                    <option value="1-100">1/100</option>
                    <option value="1-72">1/72</option>
                </select>
            </div>

        </div>

        <div class="product-grid" id="product-grid"></div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Mecha Hangar. Dự án học tập, phi thương mại</p>
    </footer>

    <script src="data.js"></script>
    <script src="san-pham.js"></script>
</body>

</html>
