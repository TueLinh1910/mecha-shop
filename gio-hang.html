<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - Mecha Hangar</title>
    <link rel="icon" type="image/svg" href="images/logo-icon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <h1 class="logo">
            <a href="index.html">
                <img src="images/logo.svg" alt="Mecha Hangar">
            </a>
        </h1>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="san-pham.html">Sản phẩm</a>
            <a href="gio-hang.html">Giỏ hàng (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <h2>Giỏ hàng của bạn</h2>

        <div class="cart-layout">
            <div class="cart-list" id="cart-list"></div>

            <aside class="cart-summary" id="cart-summary">
                <h3>Tóm tắt đơn hàng</h3>
                <div class="summary-row">
                    <span>Số sản phẩm</span>
                    <span id="summary-count">0</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Tổng tiền</span>
                    <span id="summary-total">0đ</span>
                </div>
                <a href="thanh-toan.html" class="btn btn-primary checkout-btn">Tiến hành thanh toán</a>
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Mecha Hangar. Dự án học tập, phi thương mại</p>
    </footer>

    <script src="data.js"></script>
    <script src="cart.js"></script>
    <script src="gio-hang.js"></script>
</body>

</html>
